<!-- Floating Calculator Button -->
<button id="calculator-btn" title="Taschenrechner öffnen/schließen (Alt + R)" aria-label="Taschenrechner">
    🧮
</button>

<!-- Calculator Window (leicht breiter via bestehender .with-history Regel) -->
<div id="calculator" class="with-history" role="application" aria-label="Wissenschaftlicher Taschenrechner">

    <!-- Panel Header -->
    <div class="header">
        <h3>Taschenrechner</h3>
        <div class="header-buttons">
            <button id="history-toggle" class="history-btn" type="button" aria-label="Verlauf anzeigen/verstecken" title="Verlauf">
                📜
            </button>
            <button class="close-btn" type="button" aria-label="Taschenrechner schließen">×</button>
        </div>
    </div>

    <!-- Calculator Content Container -->
    <div class="calculator-content">
        <!-- Main Calculator -->
        <div class="calculator-main">
            <!-- Display (editierbar für Keyboard-Eingabe) -->
            <input
                type="text"
                id="calc-display"
                placeholder="0"
                aria-label="Rechenergebnis"
                autocomplete="off"
                spellcheck="false"
            />

            <!-- NEU: Speicher-Indikator -->
            <div id="memory-indicator" style="display: none;">M: 0</div>

            <!-- Button Grid -->
            <div class="buttons" role="grid">
                <!-- ROW 0: Speicher-Buttons (NEU) -->
                <button type="button" aria-label="Speicher hinzufügen" class="memory-btn" data-action="add" title="M+ (Zum Speicher hinzufügen)">M+</button>
                <button type="button" aria-label="Speicher subtrahieren" class="memory-btn" data-action="subtract" title="M- (Vom Speicher abziehen)">M-</button>
                <button type="button" aria-label="Speicher abrufen" class="memory-btn" data-action="recall" title="MR (Speicher abrufen)">MR</button>
                <button type="button" aria-label="Speicher löschen" class="memory-btn" data-action="clear" title="MC (Speicher löschen)">MC</button>
                <button type="button" aria-label="Verlaufsaddition" class="history-add-btn" id="history-add-btn" title="Rechnungen aus Verlauf addieren">Σ</button>

                <!-- ROW 1: Mode Toggle Buttons -->
                <button type="button" aria-label="Winkeleinheit umschalten" class="angle-toggle" id="angle-toggle" title="Grad/Radiant umschalten">DEG</button>
                <button type="button" aria-label="Zweite Funktionen" class="shift-toggle" id="shift-toggle" title="Inverse Funktionen aktivieren">2nd</button>
                <button type="button" aria-label="Öffnende Klammer">(</button>
                <button type="button" aria-label="Schließende Klammer">)</button>
                <button type="button" aria-label="1 durch x">1/x</button>

                <!-- ROW 2: Edit/Clear -->
                <button type="button" aria-label="Alles löschen">AC</button>
                <button type="button" aria-label="Letztes Zeichen löschen" class="del-btn">DEL</button>
                <button type="button" aria-label="Eulersche Zahl">e</button>
                <button type="button" aria-label="Pi">π</button>
                <button type="button" aria-label="Quadratwurzel">√</button>

                <!-- ROW 3: 7–9 -->
                <button type="button" aria-label="Sieben">7</button>
                <button type="button" aria-label="Acht">8</button>
                <button type="button" aria-label="Neun">9</button>
                <button type="button" aria-label="Division">/</button>
                <button type="button" aria-label="x hoch 2">x²</button>

                <!-- ROW 4: 4–6 -->
                <button type="button" aria-label="Vier">4</button>
                <button type="button" aria-label="Fünf">5</button>
                <button type="button" aria-label="Sechs">6</button>
                <button type="button" aria-label="Multiplikation">*</button>
                <button type="button" aria-label="Potenz">^</button>

                <!-- ROW 5: 1–3 -->
                <button type="button" aria-label="Eins">1</button>
                <button type="button" aria-label="Zwei">2</button>
                <button type="button" aria-label="Drei">3</button>
                <button type="button" aria-label="Subtraktion">-</button>
                <button type="button" aria-label="Prozent">%</button>

                <!-- ROW 6: 0 . + -->
                <button type="button" aria-label="Null">0</button>
                <button type="button" aria-label="Dezimalkomma">.</button>
                <button type="button" aria-label="Addition">+</button>
                <button type="button" aria-label="Fakultät">!</button>
                <button type="button" aria-label="Bruchdarstellung umschalten" class="fraction-toggle" id="fraction-toggle" title="Bruchdarstellung">⅓</button>

                <!-- ROW 7: Logarithmen + "=" startet hier und ist doppelt hoch -->
                <button type="button" aria-label="Natürlicher Logarithmus" class="func-btn" id="ln-btn">ln</button>
                <button type="button" aria-label="Logarithmus" class="func-btn" id="log-btn">log</button>
                <button type="button" aria-label="Exponentialfunktion" class="func-btn" id="exp-btn">exp</button>
                <button type="button" aria-label="10 hoch x" class="func-btn" id="pow10-btn">10^x</button>
                <button type="button" aria-label="Gleich" class="equals"
                        style="grid-column: 5; grid-row: 8 / span 2;">=</button>

                <!-- ROW 8: Trig-Funktionen (zeigen sin/cos/tan oder arcsin/arccos/arctan je nach 2nd) -->
                <button type="button" aria-label="Sinus" class="trig-btn" id="sin-btn" data-primary="sin" data-secondary="asin"><span class="primary-label">sin</span><span class="secondary-label">asin</span></button>
                <button type="button" aria-label="Cosinus" class="trig-btn" id="cos-btn" data-primary="cos" data-secondary="acos"><span class="primary-label">cos</span><span class="secondary-label">acos</span></button>
                <button type="button" aria-label="Tangens" class="trig-btn" id="tan-btn" data-primary="tan" data-secondary="atan"><span class="primary-label">tan</span><span class="secondary-label">atan</span></button>
                <button type="button" aria-label="Hyperbolische Funktionen" class="hyp-toggle" id="hyp-toggle" title="Hyperbolische Funktionen">hyp</button>
                <!-- Spalte 5 ist durch "=" belegt -->
            </div>

            <!-- Panel Info -->
            <div class="calc-info" role="complementary">
                Wissenschaftlicher Taschenrechner
            </div>
        </div>

        <!-- History Panel (Hidden by default) -->
        <div id="history-panel" class="history-panel hidden">
            <div class="history-header">
                <h4>Verlauf</h4>
                <button id="clear-history" class="clear-history-btn" type="button" aria-label="Verlauf löschen" title="Verlauf löschen">
                    🗑️
                </button>
            </div>
            <div id="history-list" class="history-list">
                <div class="history-empty">Noch keine Rechnungen</div>
            </div>
        </div>
    </div>
</div>
